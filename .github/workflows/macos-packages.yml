name: macOS Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.7
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and verify app bundle
        shell: bash
        run: |
          chmod +x tools/build_macos_bundle.sh
          tools/build_macos_bundle.sh \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.rid }}" \
            artifacts/packages

      - name: Smoke-launch through Launch Services
        shell: bash
        run: |
          archive="artifacts/packages/DeviceWidget-for-Android-${{ steps.version.outputs.value }}-${{ matrix.rid }}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          app="$PWD/smoke/Device Widget.app"
          open "$app"
          for attempt in {1..20}; do
            if pgrep -f "$app/Contents/MacOS/DeviceWidget" >/dev/null; then
              pkill -f "$app/Contents/MacOS/DeviceWidget" || true
              exit 0
            fi
            sleep 1
          done
          echo "Device Widget did not remain running after Launch Services opened it." >&2
          exit 1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeviceWidget-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: artifacts/packages/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: DeviceWidget-*-osx-*
          path: packaged
          merge-multiple: true

      - name: Replace release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir current-assets
          gh release download "$GITHUB_REF_NAME" --dir current-assets
          cp packaged/*.tar.gz current-assets/
          cp THIRD_PARTY_NOTICES.md current-assets/
          rm -f current-assets/SHA256SUMS.txt
          (
            cd current-assets
            find . -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt
          )
          gh release upload "$GITHUB_REF_NAME" packaged/*.tar.gz THIRD_PARTY_NOTICES.md --clobber
          gh release upload "$GITHUB_REF_NAME" current-assets/SHA256SUMS.txt --clobber
