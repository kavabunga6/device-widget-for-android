name: Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.10
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify package
        shell: bash
        run: |
          chmod +x tools/build_linux_package.sh
          tools/build_linux_package.sh \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.rid }}" \
            artifacts/packages

      - name: Smoke-launch desktop host
        shell: bash
        run: |
          archive="artifacts/packages/DeviceWidget-for-Android-${{ steps.version.outputs.value }}-${{ matrix.rid }}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          set +e
          timeout 10s xvfb-run -a smoke/DeviceWidget/DeviceWidget
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "Device Widget failed to launch (exit $status)." >&2
            exit "$status"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeviceWidget-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: artifacts/packages/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: DeviceWidget-*-linux-*
          path: packaged
          merge-multiple: true

      - name: Replace release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir current-assets
          gh release download "$GITHUB_REF_NAME" --dir current-assets
          cp packaged/*.tar.gz current-assets/
          cp THIRD_PARTY_NOTICES.md current-assets/
          rm -f current-assets/SHA256SUMS.txt
          (
            cd current-assets
            find . -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt
          )
          gh release upload "$GITHUB_REF_NAME" packaged/*.tar.gz THIRD_PARTY_NOTICES.md --clobber
          gh release upload "$GITHUB_REF_NAME" current-assets/SHA256SUMS.txt --clobber
